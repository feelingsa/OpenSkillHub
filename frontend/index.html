<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SKILL WEB HUB</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="hub-shell">
      <header class="hero-header">
        <p class="kicker">LOCAL OPENCODE</p>
        <h1>SKILL WEB HUB</h1>
        <div id="connectionState" class="connection-state">CONNECTING</div>
        <div class="catalog-controls" aria-label="Skill catalog filters">
          <label class="catalog-search">
            <span class="sr-only">搜索 Skill</span>
            <input id="skillSearch" type="search" autocomplete="off" placeholder="搜索 Skill" />
          </label>
          <label class="catalog-filter">
            <span class="sr-only">页面状态</span>
            <select id="skillFilter">
              <option value="all">全部状态</option>
              <option value="ready">页面已就绪</option>
              <option value="pending">需要生成页面</option>
            </select>
          </label>
        </div>
      </header>

      <section class="preview-stage" aria-label="OpenCode skills preview">
        <div id="skillDeck" class="skill-deck" tabindex="0" aria-label="Mouse wheel switches skill windows"></div>
      </section>

      <div id="skillModal" class="skill-modal" aria-hidden="true">
        <article class="skill-modal-window" role="dialog" aria-modal="true" aria-labelledby="skillModalTitle">
          <div id="skillModalHero" class="skill-modal-hero"></div>
          <section class="skill-modal-body">
            <h2 id="skillModalTitle"></h2>
            <div id="skillModalContent" class="skill-modal-content"></div>
            <footer class="skill-modal-actions">
              <button id="skillStartButton" class="skill-start-button" type="button">开始</button>
            </footer>
          </section>
        </article>
      </div>

    </main>

    <main id="adminRoot" class="admin-root" hidden></main>

    <section id="skillPage" class="skill-page" hidden>
      <a class="skill-page-back" href="/">返回 Skill 目录</a>
      <div id="skillPageContent" class="skill-page-content" aria-live="polite"></div>
    </section>

    <script src="/admin.js" type="module"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
